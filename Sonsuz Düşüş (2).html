function step(dt){
  if(playing){
    S.t+=dt;S.v=S.adv?Math.min(5.6+S.adv*.2+S.t*.03,17.5):Math.min(6+S.t*.07,13);

    for(var i=0;i<layers.length;i++){var L=layers[i];if(Math.abs(L.y-S.y)>1.2)continue;

          else if(it.t===7){S.shield=1;boom(it.x,L.y,0xff6aa8,10);sfx('power')}
          else if(it.t===8){S.gold+=5;S.pw=Math.min(100,S.pw+40);S.full=S.pw>=100;boom(it.x,L.y,0x3deddb,12);sfx('coin')}
          else if(it.t===5){flash('#ff8a3a');S.pw=Math.max(0,S.pw-15);S.full=S.pw>=100;S.shake=1;sfx('smash');boom(it.x,L.y,0xff3a2a,24);L.items.forEach(function(q){if(q!==it&&q.t!==3&&q.t!==7&&q.t!==8&&Math.abs(q.x-it.x)<1.6){q.dead=true;scene.remove(q.o);boom(q.x,L.y,0x999999,8)}})}
          else if(it.t===4||it.t===9||!S.full){if(S.shield){S.shield=0;S.shake=.6;sfx('smash');boom(it.x,L.y,0xff6aa8,18)}else{die();break}}
          else{flash('#fff');ST.smashes++;S.pw=0;S.full=false;boom(it.x,L.y,0x8a90b0,26);S.shake=.8;sfx('smash')}
          scene.remove(it.o);L.items.splice(j,1)}}}
    while(layers.length&&layers[0].y>S.y+14)clearL(layers.shift());

    fill();
    var zi=Math.floor(Math.max(0,S.depth-6)/GAP/ZL);

    $('sl').textContent=S.adv?'BÖLMƏ '+S.adv+' · '+Math.floor(S.depth)+'/'+S.goal+' m':'XAL';$('sb').firstChild.style.width=(S.adv?Math.min(100,S.depth/S.goal*100):best?Math.min(100,sc/best*100):100)+'%';
    $('pw').firstChild.style.width=S.pw+'%';$('pw').className='bar'+(S.full?' full':'');
    var he=S.full?0x9a4000:0x2a1020;ZN.concat(AZ).forEach(function(z){z.mh.emissive.setHex(he)});

  for(var a=0;a<layers.length;a++)for(var b=0;b<layers[a].items.length;b++){var q=layers[a].items[b];if(q.t===3||q.t===8){q.o.rotation.y+=dt*3;q.o.position.y=layers[a].y+Math.sin(performance.now()/300+q.ph)*.1}if(q.mv){q.x=q.bx+Math.sin(performance.now()/500+q.ph)*1.2;q.o.position.x=q.x}}
  for(var k=parts.length-1;k>=0;k--){var p=parts[k];p.l-=dt*(p.r||1.4);p.vy-=(p.g===undefined?14:p.g)*dt;
    p.o.position.x+=p.vx*dt;p.o.position.y+=p.vy*dt;p.o.position.z+=p.vz*dt;if(p.sp){p.sp.a+=dt*7;p.o.position.x=p.sp.cx+Math.cos(p.sp.a)*.55;p.o.position.z=p.sp.cz+Math.sin(p.sp.a)*.55}if(p.wv)p.o.position.x=p.wv.cx+Math.sin(p.l*9+p.wv.ph)*.55;if(!p.nr){p.o.rotation.x+=dt*6;p.o.rotation.y+=dt*5}
